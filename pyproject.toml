[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory3l"
description = "Auditable three-layer memory for LLM agents: an append-only fact ledger and verifiable invariants I1-I5"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["memory", "llm", "agents", "audit", "provenance", "fact-ledger"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Version is read from the package so there is exactly one source of truth.
dynamic = ["version"]

# `requests` is declared here because the project's own requirements.txt calls it
# core, even though the audit surface, the manager and every store import fine
# without it (the HTTP LLM backends import it lazily).  Making it required costs a
# few hundred kilobytes and removes a class of surprise ImportError; everything
# else stays optional below.
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
redis = ["redis>=5.0"]
openai = ["openai>=1.0"]
tiktoken = ["tiktoken>=0.5"]
datasets = ["datasets>=2.18"]
# Streaming parser for the real LongMemEval file. Without it the loader falls back
# to json.load with a warning -- correct, just memory-hungry. It was previously
# undeclared and only found on sys.path via a stray ./.pylibs, which made the test
# suite pass on one machine and fail on a clean checkout.
longmemeval = ["ijson>=3.2"]
all = ["redis>=5.0", "openai>=1.0", "tiktoken>=0.5", "datasets>=2.18", "ijson>=3.2"]

[tool.hatch.version]
path = "memory3l/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["memory3l"]

# Pin the sdist explicitly: the repository root also holds the evaluation harness,
# the sidecar and the MCP package, none of which belong in this distribution.
[tool.hatch.build.targets.sdist]
include = ["memory3l", "README.md", "AUDIT.md", "LICENSE*"]
