<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>三层记忆 · 检索路径可视化</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230; --line: #2a2f3f;
    --text: #e6e8ee; --dim: #9aa2b5; --accent: #6ea8fe; --ok: #4ade80;
    --bad: #f87171; --warn: #fbbf24; --chip: #262b3a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.55 -apple-system, "Segoe UI", "Noto Sans SC", sans-serif; }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line);
           display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
           background: #12141c; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .meta { color: var(--dim); font-size: 12px; }
  .meta b { color: var(--text); font-weight: 600; }
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 14px; padding: 14px; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .panel > h2 { margin: 0; padding: 10px 12px; font-size: 13px; font-weight: 600;
                border-bottom: 1px solid var(--line); color: var(--dim);
                display: flex; justify-content: space-between; align-items: center; }
  .panel .body { padding: 12px; }
  select, input[type=text], textarea, button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 9px; font: inherit; font-size: 13px;
  }
  select, input[type=text] { width: 100%; }
  textarea { width: 100%; resize: vertical; min-height: 54px; }
  button { cursor: pointer; background: var(--accent); color: #0b1020; border: none;
           font-weight: 600; padding: 8px 13px; }
  button.ghost { background: var(--chip); color: var(--text); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px;
          padding: 1px 8px; font-size: 11px; color: var(--dim); margin: 2px 3px 2px 0;
          border: 1px solid var(--line); font-family: ui-monospace, monospace; }
  .chip.ok { color: #052e16; background: var(--ok); border-color: transparent; }
  .chip.bad { color: #450a0a; background: var(--bad); border-color: transparent; }
  .chip.warn { color: #451a03; background: var(--warn); border-color: transparent; }
  .chip.pick { color: #0b1020; background: var(--accent); border-color: transparent; font-weight: 600; }
  .layer { margin-bottom: 10px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .layer > .h { padding: 7px 10px; background: var(--panel2); font-size: 12px; font-weight: 600;
                display: flex; justify-content: space-between; cursor: pointer; }
  .layer > .items { max-height: 320px; overflow: auto; }
  .item { padding: 7px 10px; border-top: 1px solid var(--line); font-size: 12.5px; }
  .item:first-child { border-top: none; }
  .item .id { font-family: ui-monospace, monospace; color: var(--accent); font-size: 11.5px; }
  .item .txt { color: var(--text); margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
  .item .sub { color: var(--dim); font-size: 11px; margin-top: 3px; word-break: break-all; }
  .item.dim { opacity: .55; }
  .step { border: 1px solid var(--line); border-radius: 9px; margin-bottom: 10px; overflow: hidden; }
  .step > .h { padding: 8px 10px; background: var(--panel2); font-size: 12.5px;
               display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .step .model-text { padding: 9px 11px; white-space: pre-wrap; word-break: break-word;
                      font-size: 12.5px; border-top: 1px solid var(--line); }
  .tool { border-top: 1px solid var(--line); padding: 9px 11px; }
  .tool .path { font-family: ui-monospace, monospace; font-size: 12px; color: var(--warn);
                background: #241f10; border: 1px solid #3d3418; border-radius: 7px;
                padding: 6px 8px; margin: 5px 0 8px; word-break: break-word; }
  table.cands { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.cands th, table.cands td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  table.cands th { color: var(--dim); font-weight: 500; font-size: 11px; }
  table.cands tr.chosen td { background: #14261c; }
  table.cands td.mono { font-family: ui-monospace, monospace; }
  pre.raw { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px;
            padding: 8px; overflow: auto; max-height: 240px; font-size: 11.5px; margin: 6px 0 0; }
  details summary { cursor: pointer; color: var(--dim); font-size: 11.5px; }
  .verdict { padding: 9px 11px; border-radius: 8px; font-size: 12.5px; margin-bottom: 10px; }
  .verdict.ok { background: #10251a; border: 1px solid #1f5136; }
  .verdict.bad { background: #2a1417; border: 1px solid #5b2226; }
  .answer { padding: 11px; background: var(--panel2); border: 1px solid var(--line);
            border-radius: 9px; white-space: pre-wrap; word-break: break-word; }
  .log { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--dim);
         max-height: 180px; overflow: auto; }
  .muted { color: var(--dim); font-size: 12px; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--dim);
          border-top-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>三层记忆 · 检索路径可视化</h1>
  <div class="meta" id="cfg"></div>
  <div class="grow"></div>
  <div class="meta" id="status"></div>
</header>

<div class="layout">
  <!-- ================= 左栏：episode + 提问 ================= -->
  <div>
    <div class="panel" style="margin-bottom:14px">
      <h2>Episode</h2>
      <div class="body">
        <select id="episode-select"></select>
        <div class="row" style="margin-top:8px">
          <label class="muted">只灌入前</label>
          <input type="text" id="turn-limit" placeholder="全部轮" style="width:70px">
          <label class="muted">轮</label>
          <button id="load-btn">灌入 episode</button>
        </div>
        <div class="muted" id="episode-meta" style="margin-top:8px"></div>
        <div class="log" id="load-log" style="margin-top:8px"></div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:14px">
      <h2>对话（空白会话可逐轮加）</h2>
      <div class="body">
        <textarea id="turn-input" placeholder="说一句话，例如：我的工位在3楼。"></textarea>
        <div class="row" style="margin-top:8px">
          <button id="turn-btn" class="grow">加一轮对话（模型回复 + 生成摘要）</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button id="new-session-btn" class="ghost grow">新会话（清空记忆）</button>
        </div>
        <div class="muted" id="turn-hint" style="margin-top:6px">先点「新会话」清空记忆，然后一句一句加。</div>
        <div class="log" id="turn-log" style="margin-top:8px"></div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:14px">
      <h2>提问（只读记忆，不写入）</h2>
      <div class="body">
        <textarea id="question" placeholder="例如：在改成12楼之前，我的工位楼层是什么？"></textarea>
        <div class="row" style="margin-top:8px">
          <button id="ask-btn" class="grow" disabled>提问并追踪路径</button>
        </div>
        <div class="muted" id="ask-hint" style="margin-top:6px">请先点上面的「灌入 episode」——记忆空的时候无法提问。</div>
        <div class="muted" style="margin-top:8px">数据集探针（点一下填入并带上 gold 答案）</div>
        <div id="probes" style="max-height:220px; overflow:auto; margin-top:6px"></div>
      </div>
    </div>

    <div class="panel">
      <h2>本轮日志</h2>
      <div class="body">
        <div class="log" id="ask-log">（尚未提问）</div>
      </div>
    </div>
  </div>

  <!-- ================= 右栏：四层记忆 + 路径追踪 ================= -->
  <div>
    <div class="panel" style="margin-bottom:14px">
      <h2>记忆四层 <span class="muted" id="layer-counts"></span></h2>
      <div class="body" id="layers"></div>
    </div>

    <div class="panel" style="margin-bottom:14px">
      <h2>检索路径追踪</h2>
      <div class="body" id="trace"><div class="muted">先灌入 episode，再提问。</div></div>
    </div>

    <div class="panel">
      <h2>答案</h2>
      <div class="body"><div class="answer" id="answer">—</div></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let STATE = null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function short(s) { return String(s || "").split("/").pop(); }
function status(html) { $("status").innerHTML = html; }

const TOKEN = new URLSearchParams(location.search).get("token") || "";
function withToken(url) {
  if (!TOKEN) return url;
  return url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN);
}
async function getJSON(url) {
  const r = await fetch(withToken(url));
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function postJSON(url, body) {
  const r = await fetch(withToken(url), {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || JSON.stringify(data));
  return data;
}

/* ---------------- 左栏渲染 ---------------- */
function renderConfig(state) {
  const c = state.config || {};
  $("cfg").innerHTML =
    `LLM <b>${esc(c.llm_backend)}/${esc(c.model)}</b> · system <b>${esc(c.system)}</b> · ` +
    `store <b>${esc(c.store)}</b> · window <b>${c.recent_window_turns}</b> 轮 · ` +
    `chain 上限 <b>${c.active_chain_token_limit}</b> tok`;
}

function renderEpisodePicker(state) {
  const sel = $("episode-select");
  sel.innerHTML = (state.episodes || []).map(e =>
    `<option value="${e.index}" ${e.index === state.episode_index ? "selected" : ""}>` +
    `${esc(e.episode_id)} · ${e.turns} 轮 · ${e.probes} 探针</option>`).join("");
}

function renderEpisodeMeta(state) {
  const ep = state.episode;
  if (!ep) { $("episode-meta").textContent = ""; return; }
  const facts = Object.entries(ep.facts || {}).map(([k, v]) =>
    `<div class="sub"><b>${esc(k)}</b>: ${v.map(([t, val]) => `t${esc(t)}=${esc(val)}`).join(" → ")}</div>`
  ).join("");
  $("episode-meta").innerHTML =
    `<div class="sub">${esc(ep.episode_id)} · ${ep.turns} 轮 · ${ep.probes} 探针` +
    `${state.loaded ? "" : " · <span class='chip warn'>尚未灌入</span>"}</div>` +
    (facts ? `<details><summary>事实时间线（标准答案依据）</summary>${facts}</details>` : "");
  $("probes").innerHTML = (ep.probes || []).map((p, i) =>
    `<div class="item" style="padding:5px 4px; cursor:pointer" data-q="${esc(p.question)}" data-g="${esc(p.answer)}">` +
    `<span class="chip ${p.probe_type === "history_fact" ? "warn" : ""}">${esc(p.probe_type)}</span> ` +
    `${esc(p.question)}<div class="sub">gold: ${esc(p.answer)}</div></div>`
  ).join("") || '<div class="muted">该 episode 没有探针，可自由提问。</div>';
  $("probes").querySelectorAll("[data-q]").forEach(el => el.onclick = () => {
    $("question").value = el.dataset.q;
    $("question").dataset.gold = el.dataset.g;
  });
}

/* ---------------- 四层记忆渲染 ---------------- */
function renderLayers(layers) {
  const L = layers || {indexes: [], active: [], window: [], archive: [], raw: []};
  const unfiled = (L.active || []).filter(s => !s.filed).length;
  const filed = (L.active || []).length - unfiled;
  $("layer-counts").textContent =
    `索引 ${(L.indexes || []).length} · 活跃链 ${unfiled}（已收进索引 ${filed}） · 滑动窗口 ${L.window.length} · 归档 ${L.archive.length} · 原文 ${L.raw.length}`;

  const indexes = (L.indexes || []).map(e => `
    <div class="item">
      <span class="id">${esc(e.short_id)}</span>
      <span class="chip pick">INDEX ${esc(e.time_label)} · ${e.size} 条</span>
      ${(e.fact_keys || []).map(k => `<span class="chip">${esc(k)}</span>`).join("")}
      <div class="txt"><b>${esc(e.title)}</b></div>
      <div class="sub">指向: ${e.members.map(m => esc(m.short_id)).join(", ")}</div>
      <details><summary>展开目录项内容（工具 expand_index 会返回这些）</summary>
        <pre class="raw">${esc((e.preview || []).join("\n"))}</pre></details>
    </div>`).join("") || '<div class="item muted">（还没有索引条目：链条未超预算时不会建索引）</div>';

  const active = (L.active || []).filter(s => !s.filed).map(s => `
    <div class="item">
      <span class="id">${esc(s.short_id)}</span>
      <span class="chip ${s.override_ids.length ? "warn" : ""}">OVERRIDES: ${s.short_override_ids.join(",") || "none"}</span>
      ${s.origin === "capacity_merge" ? '<span class="chip">容量合并</span>' : ""}
      ${(s.fact_keys || []).map(k => `<span class="chip">${esc(k)}</span>`).join("")}
      <div class="txt">${esc(s.text)}</div>
      <div class="sub">raw_ref: ${esc(short(s.raw_ref))}</div>
    </div>`).join("") || '<div class="item muted">（空）</div>';

  const win = L.window.map(r => `
    <div class="item">
      <span class="id">turn ${r.turn_index}</span> <span class="chip">${esc(r.short_id)}</span>
      <div class="txt">user: ${esc(r.user_msg)}
agent: ${esc(r.agent_msg)}</div>
    </div>`).join("") || '<div class="item muted">（空）</div>';

  const arch = L.archive.map(a => `
    <div class="item ${a.is_overridden ? "" : "dim"}">
      <span class="id">${esc(a.short_id)}</span>
      <span class="chip ${a.is_overridden ? "bad" : ""}">${a.is_overridden ? "被覆盖" : "容量淘汰"}</span>
      <span class="chip">${esc(a.archive_reason)}</span>
      ${a.superseded_by_short ? `<span class="chip">→ ${esc(a.superseded_by_short)}</span>` : ""}
      ${(a.short_override_ids || []).length ? `<span class="chip warn">覆盖 ${a.short_override_ids.join(",")}</span>` : ""}
      ${a.merged_from && a.merged_from.length ? `<span class="chip">合并自 ${a.merged_from.length} 条</span>` : ""}
      <div class="txt">${esc(a.text)}</div>
      <div class="sub">raw_ref: ${esc(short(a.raw_ref))}</div>
    </div>`).join("") || '<div class="item muted">（空）</div>';

  const raw = L.raw.map(r => `
    <div class="item">
      <span class="id">turn ${r.turn_index}</span> <span class="chip">${esc(r.short_id)}</span>
      <div class="txt">user: ${esc(r.user_msg)}
agent: ${esc(r.agent_msg)}</div>
    </div>`).join("") || '<div class="item muted">（空）</div>';

  const layer = (title, count, html, open) => `
    <div class="layer">
      <div class="h" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? '' : 'none'">
        <span>${title}</span><span class="muted">${count}</span>
      </div>
      <div class="items" style="${open ? "" : "display:none"}">${html}</div>
    </div>`;
  const filedItems = (L.active || []).filter(s => s.filed).map(s => `
    <div class="item dim">
      <span class="id">${esc(s.short_id)}</span>
      <span class="chip">已收进索引 ${esc((s.index_id || "").split("/").pop())}</span>
      <div class="txt">${esc(s.text)}</div>
    </div>`).join("") || '<div class="item muted">（没有已收纳的下级摘要）</div>';

  $("layers").innerHTML =
    layer("⓪ 索引层 / 目录标题（进 prompt）", (L.indexes || []).length, indexes, true) +
    layer("① 活跃摘要链（未收进索引的部分，进 prompt）", unfiled, active, true) +
    layer("①b 已收进索引的下级摘要（按 id 可读，工具可展开）", filed, filedItems, false) +
    layer("④ 近期滑动窗口（逐字，进 prompt）", L.window.length, win, true) +
    layer("② 归档摘要库（按 id / 属性精确查）", L.archive.length, arch, true) +
    layer("③ 原始详情库（按 reference_id 精确查）", L.raw.length, raw, false);
}

function applyReadiness(state) {
  const ready = !!state.loaded;
  $("ask-btn").disabled = !ready;
  $("turn-btn").disabled = !ready;
  const blank = !!state.blank_mode;
  $("ask-hint").innerHTML = ready
    ? (blank
        ? '<span class="chip ok">空白会话</span> 可以先问（会答"记忆中没有"），也可以先加几轮对话。'
        : '<span class="chip ok">记忆已就绪</span> 可以直接提问；点探针会自动带上 gold 答案。')
    : (blank
        ? '先点「新会话（清空记忆）」，然后逐轮加对话或直接提问。'
        : '请先点上面的「灌入 episode」——记忆空的时候无法提问。');
  $("turn-hint").innerHTML = ready
    ? (blank
        ? '<span class="chip ok">已开新会话</span> 每加一轮 = 模型回复 + 生成摘要 + 维护三层记忆。'
        : '<span class="chip">当前是数据集 episode</span> 也可继续加自定义轮次。')
    : '先点「新会话（清空记忆）」，然后一句一句加。';
  $("episode-select").disabled = blank;
  $("load-btn").disabled = blank;
}

/* ---------------- 路径追踪渲染 ---------------- */
function renderCandidates(cands) {
  if (!cands || !cands.length) return "";
  const rows = cands.map(c => `
    <tr class="${c.outcome === "chosen" ? "chosen" : ""}">
      <td class="mono">${esc(c.short_id || short(c.summary_id))}</td>
      <td>${esc(c.kind || "")}</td>
      <td class="mono">${esc(c.value || "")}</td>
      <td>${c.outcome === "chosen"
            ? `<span class="chip pick">选中</span>`
            : c.outcome === "traversed" ? `<span class="chip">穿过</span>`
            : `<span class="chip">落选</span>`}</td>
      <td class="sub">${esc(c.reason || "")}</td>
    </tr>`).join("");
  return `<table class="cands">
      <tr><th>摘要/记录</th><th>来源</th><th>该属性取值</th><th>结果</th><th>理由</th></tr>
      ${rows}</table>`;
}

function renderTrace(data) {
  const steps = data.steps || [];
  if (!steps.length) {
    $("trace").innerHTML = '<div class="muted">本轮没有工具调用（模型直接从活跃链/窗口作答）。</div>';
    return;
  }
  const html = steps.map(s => {
    const kindChip = s.kind === "tool_call"
      ? '<span class="chip pick">工具调用</span>'
      : s.kind === "final_answer" ? '<span class="chip ok">最终回答</span>'
      : s.kind === "forced_answer" ? '<span class="chip warn">强制作答</span>'
      : `<span class="chip bad">${esc(s.kind)}</span>`;
    const tools = (s.tools || []).map(t => `
      <div class="tool">
        <div class="row wrap">
          <span class="chip ${t.ok ? "ok" : "bad"}">${esc(t.name)} ${t.ok ? "命中" : "失败"}</span>
          <span class="muted">${t.latency_ms} ms</span>
          ${t.error ? `<span class="chip bad">${esc(t.error)}</span>` : ""}
        </div>
        ${t.path ? `<div class="path">路径：${esc(t.path)}</div>` : ""}
        ${renderCandidates(t.candidates)}
        <details><summary>工具返回给模型的原文</summary><pre class="raw">${esc(t.content)}</pre></details>
      </div>`).join("");
    return `<div class="step">
        <div class="h"><span class="chip">第 ${s.iteration} 步</span>${kindChip}
          <span class="muted">${(s.tools || []).length} 次工具调用</span></div>
        <div class="model-text">${esc(s.model_text)}</div>
        ${tools}
      </div>`;
  }).join("");
  $("trace").innerHTML = html;
}

function renderGrounding(g) {
  if (!g) return "";
  const H = g.hits || {};
  const block = (title, items, fmt) => {
    if (!items || !items.length) {
      return `<div class="sub">${title}: <span class="chip bad">没有</span></div>`;
    }
    return `<div class="sub">${title}: <span class="chip ok">${items.length} 处</span></div>` +
      `<div class="sub" style="margin-left:10px">${items.slice(0, 6).map(fmt).join("<br>")}</div>`;
  };
  return `<div class="verdict ${g.total_hits ? "ok" : "bad"}">
      <b>标准答案核对</b>（gold = <span class="mono">${esc(g.gold)}</span>，本地字符串匹配
      ${g.string_match ? '<span class="chip ok">命中</span>' : '<span class="chip bad">未命中</span>'}）<br>
      <span class="muted">${esc(g.verdict)}</span>
    </div>` +
    block("活跃链", H.active, (h) => `• ${esc(h.id)}: ${esc(h.text)}`) +
    block("归档库", H.archive, (h) =>
      `• ${esc(h.id)}（${h.is_overridden ? "被覆盖" : "容量淘汰"}，raw_ref=${esc(h.raw_ref)}）: ${esc(h.text)}`) +
    block("原始库", H.raw, (h) => `• turn ${h.turn_index} ${esc(h.id)}: ${esc(h.user_msg)}`) +
    block("滑动窗口", H.window, (h) => `• turn ${h.turn_index} ${esc(h.id)}`);
}

/* ---------------- 交互 ---------------- */
async function refresh() {
  status('<span class="spin"></span>');
  try {
    STATE = await getJSON("/api/state");
    renderConfig(STATE);
    renderEpisodePicker(STATE);
    renderEpisodeMeta(STATE);
    renderLayers(STATE.layers);
    applyReadiness(STATE);
    status("");
  } catch (e) {
    status(`<span class="chip bad">状态获取失败</span> ${esc(e.message)}`);
  }
}

async function loadEpisode() {
  const index = parseInt($("episode-select").value || "0", 10);
  const limit = $("turn-limit").value.trim();
  $("load-btn").disabled = true;
  status('<span class="spin"></span> 正在灌入并生成摘要…（每轮一次摘要调用，请稍候）');
  try {
    const st = await postJSON("/api/load", {index, limit: limit || null});
    STATE = st;
    renderEpisodeMeta(st);
    renderLayers(st.layers);
    applyReadiness(st);
    // prefill the first probe so the next click is one click away
    const first = (st.episode && st.episode.probes || [])[0];
    if (first && !$("question").value.trim()) {
      $("question").value = first.question;
      $("question").dataset.gold = first.answer;
    }
    $("load-log").innerHTML = (st.load_log || []).map(l => esc(l)).join("<br>") ||
      "本 episode 没有触发覆盖/压缩。";
    $("trace").innerHTML = '<div class="muted">已灌入。现在提问吧。</div>';
    $("answer").textContent = "—";
    const c = st.layers ? Object.entries(st.layers).map(([k, v]) => `${k} ${v.length}`).join(" · ") : "";
    status(`<span class="chip ok">灌入完成</span> <span class="muted">${c}</span>`);
  } catch (e) {
    status(`<span class="chip bad">灌入失败</span> ${esc(e.message)}`);
  } finally {
    $("load-btn").disabled = false;
  }
}

async function ask() {
  const q = $("question").value.trim();
  if (!q) return;
  const gold = $("question").dataset.gold || "";
  $("ask-btn").disabled = true;
  status('<span class="spin"></span> 模型推理 + 工具回查中…');
  try {
    const data = await postJSON("/api/ask", {question: q, gold});
    renderTrace(data);
    renderLayers(data.layers);
    const g = data.grounding;
    $("answer").innerHTML =
      (g ? renderGrounding(g) : "") + esc(data.answer || "(空)") +
      (data.error ? `\n\n<span class="chip bad">${esc(data.error)}</span>` : "");
    const m = data.metrics || {};
    $("ask-log").innerHTML =
      `问题：${esc(q)}<br>` +
      `LLM 调用 ${m.llm_calls} · 工具 ${m.tool_calls_resolved}/${m.tool_calls_attempted} 命中 · ` +
      `上下文 ${m.context_tokens} tok · prompt ${m.prompt_tokens} · 输出 ${m.completion_tokens} · ${m.latency_ms} ms`;
    status('<span class="chip ok">完成</span>');
  } catch (e) {
    const msg = String(e.message || e);
    const friendly = msg.includes("load an episode")
      ? "还没灌入 episode：先点左栏「灌入 episode」，等它完成后按钮才会变亮。"
      : msg.includes("empty question") ? "问题不能为空。" : msg;
    status(`<span class="chip bad">提问失败</span> ${esc(friendly)}`);
    $("ask-log").textContent = friendly;
  } finally {
    $("ask-btn").disabled = false;
  }
}

async function newSession() {
  $("new-session-btn").disabled = true;
  status('<span class="spin"></span> 清空记忆中…');
  try {
    const st = await postJSON("/api/reset", {});
    STATE = st;
    renderLayers(st.layers);
    applyReadiness(st);
    $("turn-log").innerHTML = esc((st.load_log || [])[0] || "记忆已清空");
    $("trace").innerHTML = '<div class="muted">新会话，记忆为空。先加几轮对话，或者直接提问试试。</div>';
    $("answer").textContent = "—";
    $("question").value = ""; delete $("question").dataset.gold;
    status('<span class="chip ok">已清空</span>');
  } catch (e) {
    status(`<span class="chip bad">清空失败</span> ${esc(e.message)}`);
  } finally {
    $("new-session-btn").disabled = false;
  }
}

async function addTurn() {
  const text = $("turn-input").value.trim();
  if (!text) return;
  $("turn-btn").disabled = true;
  status('<span class="spin"></span> 模型回复 + 生成摘要中…');
  try {
    const st = await postJSON("/api/turn", {user: text});
    renderLayers(st.layers);
    applyReadiness(st);
    const ts = st.turn_stats || {};
    const bits = [];
    if (ts.new_summary_id) bits.push(`新摘要 ${short(ts.new_summary_id)}`);
    if ((ts.overridden_ids || []).length) bits.push(`<span class="chip warn">覆盖 ${ts.overridden_ids.map(short).join(",")}</span>`);
    if ((ts.capacity_merged_ids || []).length) bits.push(`<span class="chip warn">容量合并 ${ts.capacity_merged_ids.length} 条</span>`);
    if ((ts.invalid_override_ids || []).length) bits.push(`<span class="chip bad">丢弃幻觉 id</span>`);
    $("turn-log").innerHTML =
      `你：${esc(text)}<br>模型：${esc(st.reply || "")}<br>` +
      `<span class="muted">${bits.join(" · ") || "（本轮无覆盖/压缩）"}</span>` +
      `<br><span class="muted">活跃链 ${(st.layers.active || []).length} · 归档 ${(st.layers.archive || []).length} · 窗口 ${(st.layers.window || []).length}</span>`;
    if (st.steps && st.steps.length) renderTrace({steps: st.steps});
    $("turn-input").value = "";
    status('<span class="chip ok">已加入一轮</span>');
  } catch (e) {
    status(`<span class="chip bad">加轮失败</span> ${esc(e.message)}`);
    $("turn-log").textContent = e.message;
  } finally {
    $("turn-btn").disabled = false;
  }
}

$("new-session-btn").onclick = newSession;
$("turn-btn").onclick = addTurn;
$("turn-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); addTurn(); }
});
$("load-btn").onclick = loadEpisode;
$("ask-btn").onclick = ask;
$("question").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") ask();
  else if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
$("question").addEventListener("input", () => { delete $("question").dataset.gold; });
$("episode-select").onchange = () => {
  STATE.loaded = false;
  applyReadiness(STATE);
  $("question").dataset.gold = "";
  refresh();
};
refresh();
</script>
</body>
</html>
